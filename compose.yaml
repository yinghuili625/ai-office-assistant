name: ${PLATFORM_PROJECT_NAME:?请先运行启动脚本初始化当前项目标识}
services:
  application:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3080"
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      PLATFORM_INSTANCE_ID: ${PLATFORM_INSTANCE_ID:?请先运行启动脚本初始化当前项目标识}
      MAX_STORED_BYTES: ${MAX_STORED_BYTES:-4294967296}
      TZ: Asia/Shanghai
      SCHEDULER: external
      AUTOMATION_KEY: ${AUTOMATION_KEY:?请先运行启动脚本生成本地密钥}
      SEED_DEMO: ${SEED_DEMO:-1}
      SERVERCHAN_SENDKEY: ${SERVERCHAN_SENDKEY:-}
    ports:
      - "127.0.0.1:${PORT:-3080}:3080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 12
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.7
    restart: unless-stopped
    entrypoint: ["tini", "--", "/bin/sh", "/opt/office/scripts/bootstrap-n8n.sh"]
    depends_on:
      application:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      GENERIC_TIMEZONE: Asia/Shanghai
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_EDITOR_PORT:-5680}
      N8N_WEBHOOK_URL: http://localhost:${N8N_EDITOR_PORT:-5680}/
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?请先运行启动脚本生成本地密钥}
      AUTOMATION_KEY: ${AUTOMATION_KEY:?请先运行启动脚本生成本地密钥}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE: "true"
    ports:
      - "127.0.0.1:${N8N_EDITOR_PORT:-5680}:5678"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./scripts:/opt/office/scripts:ro
      - ./workflows:/opt/office/workflows:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      start_period: 150s
      retries: 18
